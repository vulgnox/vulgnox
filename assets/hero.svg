<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="voidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d0b"/>
      <stop offset="100%" stop-color="#040403"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="42%" r="78%">
      <stop offset="45%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.92"/>
    </radialGradient>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="transparent"/>
      <rect width="4" height="1" fill="#3a362f" opacity="0.32"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="0 4" dur="0.45s" repeatCount="indefinite"/>
    </pattern>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#242220" stroke-width="1"/>
    </pattern>

    <filter id="noise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.8  0 0 0 0 0.78  0 0 0 0 0.72  0 0 0 0.1 0"/>
    </filter>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="typeClip">
      <rect x="68" y="222" height="30" width="0">
        <animate attributeName="width" values="0;0;500;500;500" keyTimes="0;0.08;0.42;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="320" fill="url(#voidGrad)"/>
  <rect width="900" height="320" fill="url(#grid)" opacity="0.5"/>
  <rect width="900" height="320" fill="url(#scanlines)"/>

  <g stroke="#4a453c" stroke-width="2" fill="none">
    <path d="M24 20 L24 46 M24 20 L50 20"/>
    <path d="M876 20 L876 46 M876 20 L850 20"/>
    <path d="M24 300 L24 274 M24 300 L50 300"/>
    <path d="M876 300 L876 274 M876 300 L850 300"/>
  </g>
  <text x="48" y="34" font-family="'Courier New', Consolas, monospace" font-size="11" letter-spacing="3" fill="#4a453c">EVA-SHELL // OS</text>
  <text x="852" y="296" font-family="'Courier New', Consolas, monospace" font-size="11" letter-spacing="2" fill="#4a453c" text-anchor="end">VALDRIS-NET</text>

  <g font-family="'Courier New', Consolas, monospace" font-weight="700" filter="url(#glow)">
    <text x="70" y="160" font-size="104" letter-spacing="6" fill="#8a1c1c" opacity="0.75">NOX
      <animate attributeName="x" values="70;70;80;70;58;70;70;70;62;70" keyTimes="0;0.3;0.32;0.34;0.36;0.38;0.6;0.62;0.64;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="70" y="160" font-size="104" letter-spacing="6" fill="#4d5a8f" opacity="0.5">NOX
      <animate attributeName="x" values="70;70;60;70;82;70;70;70;78;70" keyTimes="0;0.3;0.32;0.34;0.36;0.38;0.6;0.62;0.64;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="70" y="160" font-size="104" letter-spacing="6" fill="#565f5a" opacity="0.55">NOX
      <animate attributeName="y" values="160;160;154;160;166;160" keyTimes="0;0.3;0.32;0.34;0.36;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="70" y="160" font-size="104" letter-spacing="6" fill="#d8d2c4">NOX</text>
  </g>

  <g transform="translate(760,50)" fill="none" stroke="#8a1c1c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M0 0 L22 32 L6 32 L36 72">
      <animate attributeName="stroke" values="#7a1616;#7a1616;#e0504a;#7a1616;#7a1616" keyTimes="0;0.35;0.45;0.55;1" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="3;3;5;3;3" keyTimes="0;0.35;0.45;0.55;1" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <line x1="70" y1="196" x2="830" y2="196" stroke="#3a362f" stroke-width="1"/>
  <line x1="70" y1="199" x2="300" y2="199" stroke="#8a1c1c" stroke-width="1" opacity="0.6"/>

  <g font-family="'Courier New', Consolas, monospace" font-size="21" fill="#a8a398">
    <g clip-path="url(#typeClip)">
      <text x="68" y="243">&gt; tracing signal from Valdris... link stable</text>
    </g>
    <rect y="224" width="11" height="23" fill="#a8a398">
      <animate attributeName="x" values="68;68;565;565;565" keyTimes="0;0.08;0.42;0.92;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1;0;1;0;1" keyTimes="0;0.06;0.12;0.18;0.24;0.3;1" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="70" y="280" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="16" fill="#5c584f">"no one severs the wire alone."</text>

  <rect width="900" height="320" fill="url(#vignette)"/>

  <rect width="900" height="320" filter="url(#noise)" opacity="0">
    <animate attributeName="opacity" values="0;0;0.5;0.05;0" keyTimes="0;0.46;0.475;0.49;0.5" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect width="900" height="320" filter="url(#noise)" opacity="0">
    <animate attributeName="opacity" values="0;0;0.35;0;0" keyTimes="0;0.8;0.81;0.83;1" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
