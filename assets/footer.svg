<svg width="900" height="90" viewBox="0 0 900 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="scanlines3" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="transparent"/>
      <rect width="4" height="1" fill="#3a362f" opacity="0.22"/>
    </pattern>
  </defs>
  <rect width="900" height="90" fill="#0a0a09"/>
  <rect width="900" height="90" fill="url(#scanlines3)"/>
  <line x1="0" y1="0" x2="900" y2="0" stroke="#2c2a25" stroke-width="1"/>
  <g font-family="'Courier New', Consolas, monospace" text-anchor="middle">
    <text x="450" y="40" font-size="15" letter-spacing="3" fill="#7c766a">
      TRANSMISSION END
      <animate attributeName="opacity" values="1;1;0.2;1;1" keyTimes="0;0.85;0.9;0.95;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="66" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#4a453c">no one severs the wire alone — vulgnox</text>
  </g>
</svg>
